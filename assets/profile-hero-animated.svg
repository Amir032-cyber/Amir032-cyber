<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Amir — Security Engineer</title>
  <desc id="desc">Animated dark terminal-inspired profile banner for Amir, focused on Java, distributed systems, cybersecurity, and resilience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A12"/>
      <stop offset="1" stop-color="#0B1724"/>
    </linearGradient>
    <linearGradient id="cyan" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" stroke="#1E3A4A" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect x="-240" y="72" width="160" height="248" fill="#22D3EE" opacity="0.035">
      <animate attributeName="x" from="-240" to="1240" dur="8s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 72H1200" stroke="#173042"/>
    <circle cx="30" cy="36" r="7" fill="#EF4444"/>
    <circle cx="54" cy="36" r="7" fill="#F59E0B"/>
    <circle cx="78" cy="36" r="7" fill="#22C55E"/>
    <text x="1080" y="42" fill="#527287" font-family="monospace" font-size="14">profile.md</text>
    <text x="80" y="143" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">Amir</text>
    <text x="84" y="181" fill="url(#cyan)" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">SECURITY ENGINEER · RESILIENCE</text>
    <text x="84" y="216" fill="#94A3B8" font-family="monospace" font-size="16">Java · Python · Rust · TypeScript · Distributed Systems</text>
    <g opacity="0.82" stroke="url(#cyan)" stroke-width="2">
      <path d="M910 122L960 92L1010 122L1060 92L1110 122"/>
      <path d="M910 198L960 228L1010 198L1060 228L1110 198"/>
      <circle cx="910" cy="122" r="5" fill="#22D3EE"/>
      <circle cx="1010" cy="122" r="5" fill="#22D3EE"/>
      <circle cx="1110" cy="122" r="5" fill="#22D3EE"/>
      <circle cx="960" cy="228" r="5" fill="#22D3EE"/>
      <circle cx="1060" cy="228" r="5" fill="#22D3EE"/>
    </g>
    <rect x="58" y="258" width="1084" height="38" rx="6" fill="#020617" stroke="#1D4B5E"/>
    <text x="78" y="283" fill="#22D3EE" font-family="monospace" font-size="16">&gt; </text>
    <text x="105" y="283" fill="#CBD5E1" font-family="monospace" font-size="16">build systems that stay useful when everything around them gets noisy</text>
    <rect x="1116" y="270" width="3" height="18" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
